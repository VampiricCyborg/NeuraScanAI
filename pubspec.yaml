name: neurascan_ai
description: >-
  NeuraScan AI -- intelligent behavioural screening for neurological risk
  analysis. A four-minute smartphone session becomes nine behavioural features,
  compared against the user's own personal baseline rather than a population
  norm. A screening and awareness tool; not a diagnostic device.
publish_to: none

# Kept in step with the version shown on the about screen and in the PDF report
# footer, so a shared report can always be traced to the build that produced it.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  drift: ^2.35.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  record: ^7.1.1
  share_plus: ^13.3.0
  sqlite3: ^3.6.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

# Builds the bundled SQLite as SQLCipher instead of plain SQLite, which is what
# makes `PRAGMA key` work and therefore what encrypts the local database.
#
# This replaces the old sqlcipher_flutter_libs package: since package:sqlite3
# version 3, the library is selected here and fetched by the package's build
# hook, so there is no separate Flutter plugin and no open() override in Dart.
#
# SQLCipher carries its own licence and links OpenSSL on Android, Windows and
# Linux, unlike upstream SQLite which is public domain.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
