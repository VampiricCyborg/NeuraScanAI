include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing await in a timed task silently breaks the measurement rather
    # than throwing, so these are errors here rather than warnings.
    unawaited_futures: error
    discarded_futures: error
    # Public API in lib/ carries the reasoning for the design; an undocumented
    # public member in the engine is a gap in that record.
    public_member_api_docs: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "lib/firebase_options.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Correctness
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # Style, chosen to match the existing code rather than to impose a new one
    always_put_required_named_parameters_first: true
    avoid_redundant_argument_values: true
    directives_ordering: true
    omit_local_variable_types: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unnecessary_parenthesis: true
    use_super_parameters: true

    # Off because the suggestion is impossible for the cases that trigger it:
    # ScreeningEngine takes public named parameters and stores them in private
    # fields, and Dart does not allow a private named parameter, so there is no
    # initialising formal to use.
    prefer_initializing_formals: false
