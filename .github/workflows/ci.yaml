name: CI

# Runs on every push and pull request. The engine and the Flutter app are separate jobs
# because the Python reference engine is the cheapest thing to check and the most valuable
# thing to know about: if it fails, the Dart engine is wrong too and there is no point
# spending ten minutes on a Gradle build to find out.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-lab:
    name: Python reference engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: engine_lab
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: engine_lab
        run: ruff check .

      - name: Test
        working-directory: engine_lab
        run: python -m pytest -q

  flutter:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Check generated code is up to date
        # A committed .dart file that disagrees with its generator is a real source of
        # confusing failures, so the build fails here rather than later.
        run: git diff --exit-code -- ':!pubspec.lock'

      - name: Analyse
        run: flutter analyze

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  android:
    name: Build Android
    runs-on: ubuntu-latest
    # Only after the cheap checks pass, since a Gradle build is the slow part.
    needs: [engine-lab, flutter]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neurascan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
